name: Branch Browser Smoke

on:
  push:
    branches: [test-crm-estagio-perfil-produto]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test dependency
        run: python -m pip install --quiet selenium requests
      - name: Start local branch server
        run: |
          python -m http.server 8080 >/tmp/crm-http.log 2>&1 &
          sleep 2
      - name: Static branch asset smoke
        run: |
          python - <<'PY'
          import requests
          for path in ['crm.html','stage-ui.js','regions-ui.js','calls-supabase-ui.js','supabase-realtime.js']:
              r=requests.get('http://127.0.0.1:8080/'+path,timeout=10)
              print(path,r.status_code,len(r.content),r.headers.get('content-type'))
              assert r.status_code==200
          PY
      - name: Headless Chrome baseline branch smoke
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1440,1000');o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          try:
              d.get('http://127.0.0.1:8080/crm.html?auth=1');time.sleep(4)
              logs=d.get_log('browser');syntax=[x for x in logs if x.get('level')=='SEVERE' and 'SyntaxError' in x.get('message','')]
              print('TITLE',d.title,'SYNTAX',json.dumps(syntax,ensure_ascii=False))
              assert 'Taurus Magnum CRM' in d.title and not syntax
          finally:d.quit()
          PY
      - name: Headless Chrome Supabase module behavior
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1600,1200')
          d=webdriver.Chrome(options=o)
          try:
              d.get('http://127.0.0.1:8080/crm.html?auth=1');time.sleep(3)
              d.execute_script(r'''
                localStorage.setItem('sb-dbnjlvnkmgbiknhbefys-auth-token',JSON.stringify({access_token:'test-token'}));
                localStorage.setItem('crm_calls',JSON.stringify(Array.from({length:99},(_,i)=>({id:'local-'+i,result:'Perdido',date:'2026-09-22'}))));
                localStorage.setItem('crm_regioes',JSON.stringify(['LOCAL-ONLY']));
                window.TM_SUPABASE_AUTH_CLIENT={auth:{getSession:async()=>({data:{session:{access_token:'test-token'}}}),refreshSession:async()=>({data:{session:{access_token:'test-token'}}})}};
                window.__tmFetchHits={stage:0,regions:0,calls:0,followup:0,other:0};
                window.fetch=function(input,init){
                  const u=String(typeof input==='string'?input:(input&&input.url)||'');
                  const ok=o=>Promise.resolve(new Response(JSON.stringify(o),{status:200,headers:{'Content-Type':'application/json'}}));
                  if(u.includes('/rest/v1/v_followup')){window.__tmFetchHits.followup++;return ok([{lead_id:'00000000-0000-0000-0000-000000000101',nome:'Lead Teste',telefone:'5511999999999',status:'Interações',regiao:'Paulista',valor:350000,ultimo_contato:'2026-09-22',ult_dele:'2026-09-21',proximo_contato:null,dias_parado:0,dias_vencido:null,responsavel_id:'00000000-0000-0000-0000-000000000001',responsavel:'Will',prioridade:'em_dia',cadencia_7d:[{data:'2026-09-16',falou:false},{data:'2026-09-17',falou:false},{data:'2026-09-18',falou:false},{data:'2026-09-19',falou:false},{data:'2026-09-20',falou:false},{data:'2026-09-21',falou:false},{data:'2026-09-22',falou:true}],responsavel_team_id:null,tarefa_concluida:false,tarefa_concluida_em:null,tarefa_interaction_id:null,proximo_contato_em:null,primeira_interacao_em:'2026-09-21T12:00:00Z'}]);}
                  if(u.includes('/rest/v1/leads?')&&u.includes('perfil_produto')){window.__tmFetchHits.stage++;return ok([{id:'00000000-0000-0000-0000-000000000101',perfil_produto:'Pronto'},{id:'00000000-0000-0000-0000-000000000102',perfil_produto:'Obras'}]);}
                  if(u.includes('/rest/v1/regions')){window.__tmFetchHits.regions++;return ok([{id:'r1',name:'Paulista',normalized_name:'paulista'},{id:'r2',name:'Brooklin',normalized_name:'brooklin'}]);}
                  if(u.includes('/rest/v1/calls')){window.__tmFetchHits.calls++;return ok([{id:'c1',lead_id:'00000000-0000-0000-0000-000000000101',result:'Atendeu',occurred_at:'2026-09-22T10:00:00Z',occurred_date:'2026-09-22',interaction_id:'i1'},{id:'c2',lead_id:'00000000-0000-0000-0000-000000000101',result:'Caixa Postal',occurred_at:'2026-09-22T11:00:00Z',occurred_date:'2026-09-22',interaction_id:'i2'},{id:'c3',lead_id:'00000000-0000-0000-0000-000000000101',result:'Perdido',occurred_at:'2026-09-22T12:00:00Z',occurred_date:'2026-09-22',interaction_id:'i3'},{id:'c4',lead_id:'00000000-0000-0000-0000-000000000101',result:'Número Errado',occurred_at:'2026-09-22T13:00:00Z',occurred_date:'2026-09-22',interaction_id:'i4'}]);}
                  window.__tmFetchHits.other++;return ok([]);
                };
                leads=[{id:'101',_uuid:'00000000-0000-0000-0000-000000000101',_supabase:true,nome:'Lead Teste',telefone:'5511999999999',status:'Interações',valor:'350000',data:'2026-09-21',origem:'WhatsApp',perfil:'Investimento',regiao:'Paulista',ult_meu:'2026-09-22',ult_dele:'2026-09-21',notas:'',proximo_contato:''},{id:'102',_uuid:'00000000-0000-0000-0000-000000000102',_supabase:true,nome:'Lead Dois',telefone:'5511888888888',status:'Em negociação',valor:'420000',data:'2026-09-20',origem:'WhatsApp',perfil:'Moradia',regiao:'Brooklin',ult_meu:'2026-09-21',ult_dele:'2026-09-21',notas:'',proximo_contato:''}];
                window.leads=leads;try{_currentList=leads.slice();window._currentList=_currentList;}catch(e){window._currentList=leads.slice();}try{_papel='admin';_papelResolvido=true;}catch(e){}if(typeof renderLeads==='function')renderLeads();
              ''');time.sleep(.5)
              # Estágio
              d.execute_async_script("var done=arguments[0];window.CRM_ESTAGIO_UI.refresh().then(()=>done(true)).catch(e=>done('ERR:'+e.message));");time.sleep(.5)
              headers=[x.text.strip() for x in d.find_elements('css selector','#leads-thead th')];cells=[x.text.strip() for x in d.find_elements('css selector','td[data-tm-estagio-col]')];polluted=bool(d.execute_script("return leads.some(x=>Object.prototype.hasOwnProperty.call(x,'perfil_produto'));"))
              print('STAGE',cells,'polluted=',polluted);assert 'ESTÁGIO' in headers and cells[:2]==['Pronto','Obras'] and not polluted
              # Regiões
              reg=d.execute_async_script("var done=arguments[0];window.CRM_REGIONS_UI.refresh().then(()=>done(window.CRM_REGIONS_UI.list().map(x=>x.name))).catch(e=>done(['ERR:'+e.message]));");assert set(reg)=={'Paulista','Brooklin'} and 'LOCAL-ONLY' not in reg
              d.execute_script("openModal('101');");time.sleep(.3);admin=d.execute_script("var b=document.getElementById('tm-region-add');return b?getComputedStyle(b).display:null;");d.execute_script("_papel='executivo';openModal('101');");time.sleep(.3);exe=d.execute_script("var b=document.getElementById('tm-region-add');return b?getComputedStyle(b).display:null;");print('REGIONS',reg,'button',admin,exe);assert admin not in (None,'none') and exe=='none'
              # Ligações
              n=d.execute_async_script("var done=arguments[0];window.CRM_CALLS_UI.refresh().then(r=>done(r.length)).catch(e=>done(-1));");time.sleep(.3);lexical=d.execute_script("return calls.length;");results=d.execute_script("return window.CRM_CALLS_UI.rows().map(x=>x.result);");print('CALLS',n,lexical,results);assert n==4 and lexical==4 and results==['Atendeu','Caixa Postal','Perdido','Número Errado']
              # Follow-up
              d.execute_script("window.CRM_FOLLOWUP.carregar();");time.sleep(1);txt=d.execute_script("return (document.getElementById('fu-tbody')||{}).textContent||'';");hits=d.execute_script("return window.__tmFetchHits;");print('FOLLOWUP',txt[:200],json.dumps(hits,ensure_ascii=False));assert 'Lead Teste' in txt and hits['followup']>=1
              d.save_screenshot('/tmp/crm-module-smoke.png')
          finally:d.quit()
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-branch-browser-smoke
          path: /tmp/crm-module-smoke.png
          if-no-files-found: ignore
