name: Bump Duplicates UI Cache
on:
  push:
    branches: [duplicate-consolidation-v1]
    paths:
      - '.github/workflows/bump-duplicates-ui.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: duplicate-consolidation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('crm.html')
          s=p.read_text(encoding='utf-8')
          old='supabase-realtime.js?v=20260920-1455'
          new='supabase-realtime.js?v=20260920-1745'
          if old not in s:
              raise SystemExit('expected realtime cache tag not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - run: |
          git config user.name 'Taurus Magnum Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add crm.html
          git commit -m 'Bust cache for duplicates UI loader'
          git push origin HEAD:duplicate-consolidation-v1
