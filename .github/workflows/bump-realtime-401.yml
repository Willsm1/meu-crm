name: Bump Realtime 401 Cache
on:
  push:
    branches: [followup-401-retry]
    paths:
      - '.github/workflows/bump-realtime-401.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: followup-401-retry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('crm.html')
          s=p.read_text(encoding='utf-8')
          old='supabase-realtime.js?v=20260920-1455'
          new='supabase-realtime.js?v=20260920-1658'
          if old not in s:
              raise SystemExit('expected cache tag not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - run: |
          git config user.name 'Taurus Magnum Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add crm.html
          git commit -m 'Bust realtime cache for Follow-up 401 retry'
          git push origin HEAD:followup-401-retry
