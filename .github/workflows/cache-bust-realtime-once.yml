name: Cache bust realtime loader once
on:
  push:
    branches: [cache-bust-loader]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cache-bust-loader
      - name: Version realtime loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crm.html')
          s=p.read_text()
          old='<script src="supabase-realtime.js"></script>'
          new='<script src="supabase-realtime.js?v=20260920-1215"></script>'
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('expected loader line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- crm.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm.html
          git commit -m 'Version realtime loader to prevent stale UI cache'
          git push origin HEAD:cache-bust-loader
