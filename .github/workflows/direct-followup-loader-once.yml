name: Direct follow-up loader once
on:
  push:
    branches: [direct-followup-loader-fix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-followup-loader-fix
      - name: Patch direct follow-up loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crm.html')
          s=p.read_text()
          old='<script src="supabase-realtime.js?v=20260920-1215"></script>'
          block='''<script src="followup-schedule-ui.js?v=20260920-1228" data-tm-followup-schedule="1"></script>\n<script src="followup-agendar-ui.js?v=20260920-1228" data-tm-followup-agendar="1"></script>\n<script src="supabase-realtime.js?v=20260920-1228"></script>'''
          if old not in s:
              if block in s:
                  raise SystemExit(0)
              raise SystemExit('expected realtime loader line not found')
          p.write_text(s.replace(old,block,1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- crm.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm.html
          git commit -m 'Load follow-up UI modules directly'
          git push origin HEAD:direct-followup-loader-fix
