name: Patch Followup Final
on:
  push:
    branches: [followup-cadence-final]
    paths:
      - tools/patch_followup_final.py
      - tools/followup_final_trigger.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: followup-cadence-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited patch
        run: python tools/patch_followup_final.py
      - name: Validate canonical JS syntax
        run: node --check supabase-canonical.js
      - name: Validate invariants
        run: |
          grep -q 'Cadência 7D' crm.html
          grep -q 'pageSize=1000' crm.html
          grep -q '_fuCadencia(x.cadencia_7d)' crm.html
          grep -q 'CRM_FOLLOWUP.carregar' supabase-canonical.js
      - name: Commit generated changes
        run: |
          git config user.name 'Taurus Magnum Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add crm.html supabase-canonical.js
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize follow-up cadence and realtime refresh'
          git push origin HEAD:followup-cadence-final
