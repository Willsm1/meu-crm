name: Patch Followup Login
on:
  push:
    branches: [followup-login-final]
    paths:
      - 'tools/followup_login_trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: followup-login-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited patch
        run: python tools/patch_followup_login.py
      - name: Validate invariants
        run: |
          grep -q 'Acesso ao CRM' crm.html
          grep -q 'autocomplete="username"' crm.html
          grep -q 'autocomplete="current-password"' crm.html
          grep -q 'Retomar em' crm.html
          grep -q 'agendado' crm.html
          grep -q 'Faltam ' crm.html
          ! grep -q 'smoke test V1.3' crm.html
      - name: Commit generated changes
        run: |
          git config user.name 'Willsm1'
          git config user.email 'willsm1@hotmail.com'
          git add crm.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize follow-up schedule and login UX'
          git push origin HEAD:followup-login-final
