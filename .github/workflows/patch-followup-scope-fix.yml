name: Patch Followup Scope Fix
on:
  push:
    branches:
      - followup-scope-fix
    paths:
      - .github/workflows/patch-followup-scope-fix.yml
      - tools/patch-followup-scope.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: followup-scope-fix
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch-followup-scope.py
      - name: Validate
        run: |
          node --check scope-admin.js
          grep -q "function loadAllAssignments" scope-admin.js
          grep -q "l.responsavel=uid" scope-admin.js
          grep -q ">Responsável</th>" crm.html
          grep -q 'colspan="13"' crm.html
          git diff --check
          git diff --stat
      - name: Commit product files
        run: |
          git config user.name "Willsm1"
          git config user.email "willsm1@hotmail.com"
          git add crm.html scope-admin.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix scoped assignments and restore lead owner"
            git push origin followup-scope-fix
          fi
