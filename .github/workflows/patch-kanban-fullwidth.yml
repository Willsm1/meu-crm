name: Patch Kanban And Report Scope
on:
  push:
    branches:
      - kanban-fullwidth-final
    paths:
      - .github/workflows/patch-kanban-fullwidth.yml
      - tools/patch-kanban-report-scope.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kanban-fullwidth-final
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch-kanban-report-scope.py
      - name: Validate
        run: |
          node --check scope-admin.js
          grep -q '#page-kanban>.container{max-width:none;width:100%;margin:0}' crm.html
          grep -q 'grid-template-columns:repeat(6,minmax(0,1fr))' crm.html
          grep -q "page-relatorio" scope-admin.js
          grep -q "renderRelatorio" scope-admin.js
          git diff --check
          git diff --stat
      - name: Commit product files
        run: |
          git config user.name "Willsm1"
          git config user.email "willsm1@hotmail.com"
          git add crm.html scope-admin.js
          if ! git diff --cached --quiet; then
            git commit -m "Expand Kanban and sync report with active scope"
            git push origin kanban-fullwidth-final
          fi
