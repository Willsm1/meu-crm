name: Production Regression Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, hardening-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Regression guard layout
        run: python tools/test_regression_guard_layout.py
      - name: Production invariants
        run: python tools/regression_guard.py
      - name: Gateway syntax
        run: node --check services/whatsapp-gateway/server.mjs
      - name: Gateway behavioral tests
        working-directory: services/whatsapp-gateway
        run: npm test
      - name: Performance invariants
        run: python tools/performance_guard.py
      - name: Performance runtime smoke
        run: node tools/performance_runtime_test.js
      - name: Anti-regression panel smoke
        run: |
          python3 -m http.server 8766 >/tmp/tm-reg-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8766/tools/regression_panel_harness.html >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8766/tools/regression_panel_harness.html >/dev/null
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not available on runner"
            exit 1
          fi
          OUT="$($CHROME --headless --no-sandbox --disable-gpu --virtual-time-budget=1500 --dump-dom http://127.0.0.1:8766/tools/regression_panel_harness.html)"
          if echo "$OUT" | grep -q 'data-result="PASS"'; then
            echo 'ANTI_REGRESSION_PANEL: PASS'
          else
            echo 'ANTI_REGRESSION_PANEL: FAIL'
            echo "$OUT" | grep -o 'data-result="[A-Z]*"[^>]*' || true
            exit 1
          fi
      - name: Follow-up browser smoke
        run: |
          python3 -m http.server 8765 >/tmp/tm-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/tools/performance_browser_harness.html >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8765/tools/performance_browser_harness.html >/dev/null
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not available on runner"
            exit 1
          fi
          OUT="$($CHROME --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom http://127.0.0.1:8765/tools/performance_browser_harness.html)"
          if echo "$OUT" | grep -q 'data-result="PASS"'; then
            echo 'FOLLOWUP_BROWSER_SMOKE: PASS'
          else
            echo 'FOLLOWUP_BROWSER_SMOKE: FAIL'
            echo "$OUT" | grep -o 'data-result="[A-Z]*"[^>]*>[^<]*' || true
            exit 1
          fi
