name: Production Regression Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, hardening-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Production invariants
        run: python tools/regression_guard.py
