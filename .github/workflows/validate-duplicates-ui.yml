name: Validate Duplicates UI
on:
  push:
    branches: [duplicate-consolidation-v1]
    paths:
      - '.github/workflows/validate-duplicates-ui.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: duplicate-consolidation-v1
      - run: node --check duplicates-ui.js
      - run: node --check supabase-realtime.js
      - run: grep -q "supabase-realtime.js?v=20260920-1745" crm.html
      - run: grep -q "duplicates-ui.js?v=20260920-1739" supabase-realtime.js
