<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taurus Magnum CRM — WhatsApp QR — TESTE</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:minmax(0,1fr) 390px;width:100%;height:100%}.crm,.qr{border:0;width:100%;height:100%}.qrWrap{position:relative;border-left:1px solid rgba(59,130,246,.22);background:#070d1a}.label{position:absolute;z-index:3;right:12px;top:10px;background:#7c2d12;color:#fed7aa;border:1px solid rgba(251,146,60,.4);border-radius:999px;padding:4px 9px;font-size:10px;font-weight:800;pointer-events:none}@media(max-width:980px){.shell{grid-template-columns:1fr}.qrWrap{position:fixed;right:12px;bottom:12px;width:min(390px,calc(100vw - 24px));height:72vh;z-index:20;border:1px solid rgba(59,130,246,.28);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55)}}
</style>
</head>
<body>
<div class="shell">
  <iframe class="crm" src="./crm.html" title="Taurus Magnum CRM"></iframe>
  <div class="qrWrap"><div class="label">EXPERIMENTO — NÃO É PRODUÇÃO</div><iframe class="qr" src="./whatsapp-qr-test.html" title="WhatsApp QR experimental"></iframe></div>
</div>
</body>
</html>
