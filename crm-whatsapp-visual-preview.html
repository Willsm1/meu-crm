<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taurus Magnum CRM — WhatsApp Visual Preview</title><style>html,body{margin:0;height:100%;background:#070d1a}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="crm" src="crm.html"></iframe><script>const f=document.getElementById('crm');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(d.getElementById('tm-wa-preview-loader'))return;const stamp=Date.now();const load=(id,src)=>new Promise((ok,fail)=>{const s=d.createElement('script');s.id=id;s.src=src+'?v='+stamp;s.onload=ok;s.onerror=fail;d.body.appendChild(s)});load('tm-wa-preview-loader','whatsapp-followup-bridge.js').then(()=>load('tm-wa-preview-visual','crm-whatsapp-followup-visual.js')).then(()=>load('tm-wa-preview-matching','crm-whatsapp-matching-visual.js')).then(()=>load('tm-wa-preview-gpt','crm-whatsapp-gpt-briefing.js')).then(()=>load('tm-wa-preview-history-range','crm-whatsapp-history-range.js')).then(()=>load('tm-wa-preview-archive','crm-whatsapp-archive-ui.js')).then(()=>load('tm-wa-preview-storage','crm-whatsapp-storage-gate.js')).then(()=>load('tm-wa-preview-media','crm-whatsapp-media-preview.js')).then(()=>load('tm-wa-preview-archive-hotfix','crm-whatsapp-archive-hotfix.js')).catch(e=>{console.error('Falha ao carregar módulos WhatsApp da prévia',e)})}catch(e){document.body.innerHTML='<div style="color:white;padding:24px;font-family:sans-serif">Não foi possível injetar a prévia. Sirva esta pasta por localhost (ex.: python3 -m http.server 8080).</div>'}});</script></body></html>
