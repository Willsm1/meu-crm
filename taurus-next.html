<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taurus Magnum — Next RC</title>
<style>html,body{margin:0;height:100%;background:#070d1a}iframe{border:0;width:100%;height:100%;display:block}.boot{position:fixed;right:12px;bottom:12px;z-index:99999;background:#0e1628;color:#93c5fd;border:1px solid rgba(59,130,246,.35);border-radius:8px;padding:7px 10px;font:11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)}</style>
</head>
<body>
<div class="boot" id="boot">Carregando Taurus Next…</div>
<iframe id="crm" src="crm.html"></iframe>
<script>
(function(){
'use strict';
var PIN='d4b52b150feadd97389efc65629cd13548ee54c7';
var CDN='https://cdn.jsdelivr.net/gh/Willsm1/meu-crm@'+PIN+'/';
var files=[
  ['tm-wa-bridge','whatsapp-followup-bridge.js'],
  ['tm-wa-followup','crm-whatsapp-followup-visual.js'],
  ['tm-wa-matching','crm-whatsapp-matching-visual.js'],
  ['tm-wa-gpt','crm-whatsapp-gpt-briefing.js'],
  ['tm-wa-history-range','crm-whatsapp-history-range.js'],
  ['tm-wa-archive','crm-whatsapp-archive-ui.js'],
  ['tm-wa-storage','crm-whatsapp-storage-gate.js'],
  ['tm-wa-media','crm-whatsapp-media-preview.js'],
  ['tm-wa-archive-hotfix','crm-whatsapp-archive-hotfix.js'],
  ['tm-wa-ai-direct','crm-whatsapp-ai-direct.js']
];
var f=document.getElementById('crm'),status=document.getElementById('boot');
function load(d,id,src){return new Promise(function(ok,fail){if(d.getElementById(id))return ok();var s=d.createElement('script');s.id=id;s.src=CDN+src+'?v='+PIN;s.onload=ok;s.onerror=function(){fail(new Error(src));};d.body.appendChild(s);});}
f.addEventListener('load',function(){
  try{
    var d=f.contentDocument,p=Promise.resolve();
    files.forEach(function(x){p=p.then(function(){return load(d,x[0],x[1]);});});
    p.then(function(){status.textContent='Taurus Next · módulos validados carregados';setTimeout(function(){status.style.opacity='.35';},2500);})
     .catch(function(e){status.textContent='Falha ao carregar '+e.message;status.style.color='#fca5a5';});
  }catch(e){status.textContent='Falha na prévia: '+e.message;status.style.color='#fca5a5';}
});
})();
</script>
</body>
</html>
