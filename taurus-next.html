<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taurus Magnum — Next RC</title>
<style>html,body{margin:0;height:100%;background:#070d1a}iframe{border:0;width:100%;height:100%;display:block}.boot{position:fixed;right:12px;bottom:12px;z-index:99999;background:#0e1628;color:#93c5fd;border:1px solid rgba(59,130,246,.35);border-radius:8px;padding:7px 10px;font:11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)}</style>
</head>
<body>
<div class="boot" id="boot">Carregando Taurus Next…</div>
<iframe id="crm"></iframe>
<script>
(function(){
'use strict';
var f=document.getElementById('crm'),status=document.getElementById('boot');
async function boot(){
  status.textContent='Carregando Taurus Next…';
  try{
    var r=await fetch('crm.html?nextboot=20261105-scope1',{cache:'no-store'});
    if(!r.ok)throw new Error('crm.html '+r.status);
    var html=await r.text();
    html=html.replace(/supabase-realtime\.js\?v=[^"'<>\s]+/g,'supabase-realtime.js?v=20261105-scope1');
    if(!/<base\s/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1><base href="./">');
    f.srcdoc=html;
  }catch(e){
    status.textContent='Falha ao carregar Taurus Next';
    console.error('[Taurus Next clean boot]',e);
  }
}
f.addEventListener('load',function(){
  status.textContent='Taurus Next · produção atual carregada';
  setTimeout(function(){status.style.opacity='.35';},2500);
});
boot();
})();
</script>
</body>
</html>
