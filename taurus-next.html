<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taurus Magnum — Next RC</title>
<style>html,body{margin:0;height:100%;background:#070d1a}iframe{border:0;width:100%;height:100%;display:block}.boot{position:fixed;right:12px;bottom:12px;z-index:99999;background:#0e1628;color:#93c5fd;border:1px solid rgba(59,130,246,.35);border-radius:8px;padding:7px 10px;font:11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)}</style>
</head>
<body>
<div class="boot" id="boot">Carregando Taurus Next…</div>
<iframe id="crm" src="crm.html"></iframe>
<script>
(function(){
'use strict';
var f=document.getElementById('crm'),status=document.getElementById('boot');
f.addEventListener('load',function(){
  status.textContent='Taurus Next · módulos de produção carregados pelo CRM';
  setTimeout(function(){status.style.opacity='.35';},2500);
});
})();
</script>
</body>
</html>
